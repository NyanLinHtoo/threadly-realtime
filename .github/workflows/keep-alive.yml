name: Keep Realtime Service Awake

on:
  schedule:
    # Runs every 10 minutes, offset from the start of the hour
    - cron: "3/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            https://chat-app-realtime-faeq.onrender.com/health
